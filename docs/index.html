<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gajraula — Sky &amp; Air</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #14171c;
    --surface: #1b1f26;
    --surface-2: #21262f;
    --line: rgba(255,255,255,0.07);
    --text: #edebe6;
    --text-muted: #8b909b;
    --haze: #d9a441;
    --clear: #4fb6a8;
    --alert: #c1503f;
    --sensitive: #d97a3f;
    --hazard: #8a3e6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    padding: clamp(20px, 4vw, 56px);
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px; margin-bottom: 28px; }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(28px, 4vw, 40px);
    margin: 4px 0 0;
  }
  .updated { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-muted); text-align: right; }
  .updated strong { color: var(--text); font-weight: 500; }

  .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  @media (max-width: 640px) { .hero { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 24px;
  }
  .stat-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); }
  .stat-value {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(46px, 7vw, 64px);
    line-height: 1;
    margin: 8px 0 2px;
  }
  .stat-sub { color: var(--text-muted); font-size: 14px; }

  .haze-gauge { margin-top: 16px; }
  .haze-track {
    position: relative;
    height: 10px;
    border-radius: 6px;
    background: linear-gradient(90deg, var(--clear) 0%, var(--haze) 33%, var(--sensitive) 55%, var(--alert) 72%, var(--hazard) 100%);
  }
  .haze-marker {
    position: absolute;
    top: -5px;
    width: 3px;
    height: 20px;
    background: var(--text);
    border-radius: 2px;
    transform: translateX(-1.5px);
    box-shadow: 0 0 0 3px rgba(0,0,0,0.35);
  }
  .haze-scale { display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text-muted); margin-top: 6px; }

  .charts { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 20px; }
  .chart-card canvas { max-height: 220px; }
  .chart-title { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 14px; }

  table { width: 100%; border-collapse: collapse; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--text-muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
  tbody tr:last-child td { border-bottom: none; }
  .table-scroll { overflow-x: auto; }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty .big { font-family: 'Fraunces', serif; font-size: 22px; color: var(--text); margin-bottom: 8px; }

  footer { margin-top: 28px; font-size: 12px; color: var(--text-muted); text-align: center; }
  footer a { color: var(--haze); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="eyebrow">Gajraula · Amroha District · Uttar Pradesh, India · 28.8347°N 78.2439°E</div>
      <h1>Sky &amp; Air</h1>
    </div>
    <div class="updated">Last reading<br><strong id="lastUpdated">—</strong></div>
  </header>

  <div id="content">
    <div class="empty">
      <div class="big">Loading readings…</div>
    </div>
  </div>

  <footer>
    Data via <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> · model-based estimate, no ground station in Gajraula · logged hourly
  </footer>

</div>

<script>
const CSV_URL = './data/weather_aqi_log.csv';
const MAX_POINTS = 168; // ~1 week at hourly resolution

const WEATHER_CODES = {
  0: 'Clear sky', 1: 'Mainly clear', 2: 'Partly cloudy', 3: 'Overcast',
  45: 'Fog', 48: 'Depositing rime fog',
  51: 'Light drizzle', 53: 'Drizzle', 55: 'Dense drizzle',
  61: 'Light rain', 63: 'Rain', 65: 'Heavy rain',
  71: 'Light snow', 73: 'Snow', 75: 'Heavy snow',
  80: 'Light showers', 81: 'Showers', 82: 'Violent showers',
  95: 'Thunderstorm', 96: 'Thunderstorm w/ hail', 99: 'Severe thunderstorm',
};

function aqiCategory(aqi) {
  if (aqi == null || isNaN(aqi)) return { label: 'No data', color: 'var(--text-muted)' };
  if (aqi <= 50) return { label: 'Good', color: 'var(--clear)' };
  if (aqi <= 100) return { label: 'Moderate', color: 'var(--haze)' };
  if (aqi <= 150) return { label: 'Unhealthy (sensitive groups)', color: 'var(--sensitive)' };
  if (aqi <= 200) return { label: 'Unhealthy', color: 'var(--alert)' };
  if (aqi <= 300) return { label: 'Very unhealthy', color: 'var(--hazard)' };
  return { label: 'Hazardous', color: 'var(--hazard)' };
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const headers = lines[0].split(',');
  return lines.slice(1).filter(Boolean).map((line) => {
    const cells = line.split(',');
    const row = {};
    headers.forEach((h, i) => { row[h] = cells[i]; });
    return row;
  });
}

function fmtTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function renderEmpty(message) {
  document.getElementById('content').innerHTML = `<div class="empty"><div class="big">${message}</div><div>Once the hourly Action runs, readings will appear here automatically.</div></div>`;
}

function buildLayout() {
  document.getElementById('content').innerHTML = `
    <div class="hero">
      <div class="card">
        <div class="stat-label">Temperature now</div>
        <div class="stat-value" id="tempNow">—</div>
        <div class="stat-sub" id="tempSub">—</div>
      </div>
      <div class="card">
        <div class="stat-label">Air quality now (US AQI)</div>
        <div class="stat-value" id="aqiNow">—</div>
        <div class="stat-sub" id="aqiSub">—</div>
        <div class="haze-gauge">
          <div class="haze-track"><div class="haze-marker" id="haziMarker" style="left:0%"></div></div>
          <div class="haze-scale"><span>0</span><span>50</span><span>100</span><span>150</span><span>200</span><span>300+</span></div>
        </div>
      </div>
    </div>
    <div class="charts">
      <div class="card chart-card">
        <div class="chart-title">Temperature (°C)</div>
        <canvas id="tempChart"></canvas>
      </div>
      <div class="card chart-card">
        <div class="chart-title">US AQI</div>
        <canvas id="aqiChart"></canvas>
      </div>
      <div class="card chart-card">
        <div class="chart-title">Rain (mm)</div>
        <canvas id="rainChart"></canvas>
      </div>
    </div>
    <div class="card table-scroll">
      <div class="chart-title">Recent readings</div>
      <table>
        <thead><tr><th>Time</th><th>Temp °C</th><th>Humidity %</th><th>Rain mm</th><th>US AQI</th><th>PM2.5</th><th>Conditions</th></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  `;
}

function chartBase(ctx, label, color, data, labels) {
  return new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label,
        data,
        borderColor: color,
        backgroundColor: color + '22',
        fill: true,
        tension: 0.3,
        pointRadius: 0,
        borderWidth: 2,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#8b909b', maxTicksLimit: 8, font: { family: 'IBM Plex Mono', size: 10 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
        y: { ticks: { color: '#8b909b', font: { family: 'IBM Plex Mono', size: 10 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
      },
    },
  });
}

async function main() {
  let rows;
  try {
    const res = await fetch(CSV_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('fetch failed');
    rows = parseCSV(await res.text());
  } catch (e) {
    renderEmpty("Couldn't load the data file yet");
    return;
  }

  if (!rows.length) {
    renderEmpty('No readings logged yet');
    return;
  }

  rows = rows.slice(-MAX_POINTS);
  const latest = rows[rows.length - 1];

  buildLayout();

  document.getElementById('lastUpdated').textContent = fmtTime(latest.timestamp_ist || latest.timestamp_utc);

  const temp = parseFloat(latest.temperature_c);
  document.getElementById('tempNow').textContent = isNaN(temp) ? '—' : Math.round(temp) + '°';
  document.getElementById('tempSub').textContent =
    (WEATHER_CODES[parseInt(latest.weather_code)] || 'Conditions unknown') +
    ' · feels ' + (latest.apparent_temperature_c ? Math.round(latest.apparent_temperature_c) + '°' : '—') +
    ' · ' + (latest.humidity_percent || '—') + '% humidity';

  const aqi = parseFloat(latest.us_aqi);
  const cat = aqiCategory(aqi);
  const aqiEl = document.getElementById('aqiNow');
  aqiEl.textContent = isNaN(aqi) ? '—' : Math.round(aqi);
  aqiEl.style.color = cat.color;
  document.getElementById('aqiSub').innerHTML = `<span style="color:${cat.color}">${cat.label}</span> · PM2.5 ${latest.pm2_5 || '—'} µg/m³`;
  document.getElementById('haziMarker').style.left = Math.min(100, Math.max(0, (aqi / 300) * 100)) + '%';

  const labels = rows.map((r) => fmtTime(r.timestamp_ist || r.timestamp_utc));
  chartBase(document.getElementById('tempChart'), 'Temp °C', '#d9a441', rows.map((r) => parseFloat(r.temperature_c)), labels);
  chartBase(document.getElementById('aqiChart'), 'US AQI', '#c1503f', rows.map((r) => parseFloat(r.us_aqi)), labels);
  chartBase(document.getElementById('rainChart'), 'Rain mm', '#4fb6a8', rows.map((r) => parseFloat(r.rain_mm) || 0), labels);

  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = rows.slice().reverse().slice(0, 15).map((r) => `
    <tr>
      <td>${fmtTime(r.timestamp_ist || r.timestamp_utc)}</td>
      <td>${r.temperature_c ?? '—'}</td>
      <td>${r.humidity_percent ?? '—'}</td>
      <td>${r.rain_mm ?? '0'}</td>
      <td style="color:${aqiCategory(parseFloat(r.us_aqi)).color}">${r.us_aqi ?? '—'}</td>
      <td>${r.pm2_5 ?? '—'}</td>
      <td>${WEATHER_CODES[parseInt(r.weather_code)] || '—'}</td>
    </tr>
  `).join('');
}

main();
</script>
</body>
</html>
