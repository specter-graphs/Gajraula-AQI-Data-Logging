name: Log Gajraula Weather & AQI Data

on:
  schedule:
    # Every 3 hours, UTC. Adjust as you like: https://crontab.guru
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  log-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch and log data
        run: node scripts/fetch-data.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weather_aqi_log.csv
          git diff --staged --quiet || git commit -m "Log weather & AQI data $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
